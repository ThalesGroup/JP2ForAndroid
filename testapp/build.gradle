apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    namespace = "com.gemalto.jp2.test"

    defaultConfig {
        applicationId "com.gemalto.openjpeg.test"
        minSdkVersion 14
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Optional local signing config (only if properties are provided)
            if (project.hasProperty('defaultKeyStoreFile') &&
                    project.hasProperty('defaultKeyStorePassword') &&
                    project.hasProperty('defaultKeyAlias') &&
                    project.hasProperty('defaultKeyPassword')) {
                storeFile file(defaultKeyStoreFile)
                storePassword defaultKeyStorePassword
                keyAlias defaultKeyAlias
                keyPassword defaultKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('defaultKeyStoreFile')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':jp2-android')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
}

plugins {
    id "com.vanniktech.maven.publish" version "0.37.0" apply(true)
}
apply plugin: 'com.android.library'

android {
    compileSdk = 30
    namespace 'com.gemalto.jp2'
    defaultConfig {
        minSdk 16
        targetSdk 30
        versionName "1.0.4"
        versionCode 4
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    buildFeatures {
        buildConfig true
    }
    ndkVersion '22.0.7026061'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}

/*************************************************************/
/******************* PUBLISHING STUFF ************************/
/*************************************************************/
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates("io.github.michaldvorak-gemalto", "jp2-android", "${android.defaultConfig.versionName}")

    pom {
        name = "JP2ForAndroid"
        description = "A JPEG-2000 image encoder/decoder for Android"
        inceptionYear = "2019"
        url = "https://github.com/ThalesGroup/JP2ForAndroid"
        licenses {
            license {
                name = "The 2-Clause BSD License"
                url = "https://opensource.org/licenses/BSD-2-Clause"
                distribution = "repo"
            }
        }
        developers {
            developer {
                name = "Michal Dvorak"
                url = "https://github.com/michaldvorak-gemalto"
            }
        }
        scm {
            url = "https://github.com/ThalesGroup/JP2ForAndroid"
            connection = "scm:git:https://github.com/ThalesGroup/JP2ForAndroid.git"
        }
    }
}
